name: V0.2 validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create runtime environment
        run: |
          MYSQL_PASSWORD="$(openssl rand -hex 18)"
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 18)"
          ADMIN_PASSWORD="$(openssl rand -hex 18)"
          cat > .env <<EOF
          APP_DOMAIN=:80
          SESSION_COOKIE_SECURE=false
          MYSQL_DATABASE=tarsgo
          MYSQL_USER=tarsgo
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          AI_PLANNER_ENABLED=true
          AI_PLANNER_DAILY_REQUEST_LIMIT=100
          AI_PROVIDER=openai
          AI_BASE_URL=
          AI_API_KEY=ci-placeholder
          AI_MODEL=ci-placeholder
          KNOWLEDGE_ENABLED=true
          KNOWLEDGE_GITHUB_REPO=
          KNOWLEDGE_GITHUB_BRANCH=main
          KNOWLEDGE_GITHUB_TOKEN=
          KNOWLEDGE_GITHUB_PATHS=docs,knowledge
          KNOWLEDGE_STORAGE_HOST_DIR=/tmp/tarsgo-knowledge-ci
          LEAVE_CONTACT_PHONE=000-0000-0000
          LEAVE_DAILY_CUTOFF=11:30
          EOF
          echo "CI_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_MYSQL_PASSWORD=$MYSQL_PASSWORD" >> "$GITHUB_ENV"
          echo "CI_MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" >> "$GITHUB_ENV"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1/api/health
          curl -fsS http://127.0.0.1/login | grep -q 'id="app"'

      - name: Verify seeded migration through current head
        run: |
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -e "
            DROP DATABASE IF EXISTS tarsgo_migration;
            CREATE DATABASE tarsgo_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON tarsgo_migration.* TO 'tarsgo'@'%';
          "
          MIGRATION_DB="tarsgo_migration"
          docker compose exec -T -e DB_NAME="$MIGRATION_DB" api alembic upgrade 0001_v0_1
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration <<'SQL'
          INSERT INTO members (id, name, email, password_hash, role, status)
          VALUES
            (100, '张三', 'legacy-admin@example.com', NULL, 'admin', 'active'),
            (101, '李四', 'legacy-member@example.com', NULL, 'member', 'active');
          INSERT INTO tasks (id, title, deliverable, owner_id, deadline, status, created_by)
          VALUES
            (100, '旧版任务', '旧版交付', 101, '2026-09-20 18:00:00', 'todo', 100);
          SQL
          docker compose exec -T -e DB_NAME="$MIGRATION_DB" api alembic upgrade 0007_shared_execution_scene
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration -e "UPDATE tasks SET context_facts = JSON_ARRAY('legacy global fact') WHERE id = 100;"
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration -e "
            INSERT INTO item_activities (root_task_id, author_id, content)
            VALUES (100, 100, 'legacy activity stays unlinked');
          "
          docker compose exec -T -e DB_NAME="$MIGRATION_DB" api alembic upgrade 0011_team_registration
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration -e "
            INSERT INTO school_leave_runs (
              id, collected_at, created_by, reason, status, sent_at, sent_by
            ) VALUES (
              200, '2026-10-04 11:30:00', 100, 'legacy sent run', 'sent', '2026-10-04 12:00:00', 100
            );
          "
          docker compose exec -T -e DB_NAME="$MIGRATION_DB" api alembic upgrade 0015_leave_v2_windows
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration -e "
            INSERT INTO daily_leave_windows (
              id, title, start_at, end_at, open_until, created_by
            ) VALUES (
              300, 'legacy shared activity', '2026-10-10 13:00:00', '2026-10-10 17:00:00', '2026-10-10 17:00:00', 100
            );
            INSERT INTO daily_leave_entries (
              window_id, member_id, name_snapshot, student_id_snapshot, college_snapshot, participant_type
            ) VALUES (
              300, 101, '李四', '26000001', 'art', 'formal'
            );
          "
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" tarsgo_migration -e "
            INSERT INTO tasks (
              id, parent_id, title, deliverable, execution_points, cautions, prerequisites,
              result, owner_id, owner_claimable, collaboration_open, deadline, status, created_by
            ) VALUES (
              102, 100, '旧版事项分工', '旧版子任务交付', JSON_ARRAY(), JSON_ARRAY(), JSON_ARRAY(),
              '', 101, 0, 0, NULL, 'todo', 100
            );
          "
          docker compose exec -T -e DB_NAME="$MIGRATION_DB" api alembic upgrade head
          DEADLINE_NULLABLE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT IS_NULLABLE FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'tasks' AND column_name = 'deadline'")"
          test "$DEADLINE_NULLABLE" = "YES"
          LEGACY_DEADLINE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT DATE_FORMAT(deadline, '%Y-%m-%d %H:%i:%s') FROM tasks WHERE id = 100")"
          test "$LEGACY_DEADLINE" = "2026-09-20 18:00:00"
          STUDENT_ID_NULLABLE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT IS_NULLABLE FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'members' AND column_name = 'student_id'")"
          test "$STUDENT_ID_NULLABLE" = "YES"
          LEGACY_STUDENT_IDS="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT COUNT(*) FROM members WHERE id IN (100, 101) AND student_id IS NULL")"
          test "$LEGACY_STUDENT_IDS" = "2"
          COLLEGE_NULLABLE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT IS_NULLABLE FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'members' AND column_name = 'college'")"
          test "$COLLEGE_NULLABLE" = "YES"
          TEAM_MEMBERSHIP_NULLABLE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT IS_NULLABLE FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'members' AND column_name = 'team_membership'")"
          test "$TEAM_MEMBERSHIP_NULLABLE" = "YES"
          LEGACY_IDENTITY_EMPTY="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT COUNT(*) FROM members WHERE id IN (100, 101) AND college IS NULL AND team_membership IS NULL")"
          test "$LEGACY_IDENTITY_EMPTY" = "2"
          LEAVE_TABLES="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'tarsgo_migration' AND table_name IN ('school_leave_requests', 'school_leave_runs', 'school_leave_group_results')")"
          test "$LEAVE_TABLES" = "3"
          CAMP_TABLES="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'tarsgo_migration' AND table_name IN ('camp_leave_events', 'camp_leave_participants')")"
          test "$CAMP_TABLES" = "2"
          CAMP_EMPTY="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT CONCAT((SELECT COUNT(*) FROM camp_leave_events), '|', (SELECT COUNT(*) FROM camp_leave_participants))")"
          test "$CAMP_EMPTY" = "0|0"
          DAILY_LEAVE_TABLES="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'tarsgo_migration' AND table_name IN ('daily_leave_windows', 'daily_leave_entries')")"
          test "$DAILY_LEAVE_TABLES" = "2"
          DAILY_LEAVE_PRESERVED="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT CONCAT((SELECT COUNT(*) FROM daily_leave_windows), '|', (SELECT COUNT(*) FROM daily_leave_entries), '|', (SELECT COUNT(*) FROM daily_leave_entries WHERE window_id = 300 AND start_at IS NULL AND end_at IS NULL))")"
          test "$DAILY_LEAVE_PRESERVED" = "1|1|1"
          LEGACY_ROOT_KIND="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT kind FROM tasks WHERE id = 100")"
          test "$LEGACY_ROOT_KIND" = "item"
          LEGACY_CHILD_KIND="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT kind FROM tasks WHERE id = 102")"
          test "$LEGACY_CHILD_KIND" = "task"
          DAILY_ENTRY_WINDOW_NULLABLE="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT IS_NULLABLE FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'daily_leave_entries' AND column_name = 'window_id'")"
          test "$DAILY_ENTRY_WINDOW_NULLABLE" = "YES"
          DAILY_ENTRY_TIME_COLUMNS="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'daily_leave_entries' AND column_name IN ('start_at', 'end_at')")"
          test "$DAILY_ENTRY_TIME_COLUMNS" = "2"
          LEGACY_RUN="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "SELECT CONCAT(status, '|', DATE_FORMAT(downloaded_at, '%Y-%m-%d %H:%i:%s'), '|', downloaded_by) FROM school_leave_runs WHERE id = 200")"
          test "$LEGACY_RUN" = "awaiting_return|2026-10-04 12:00:00|100"
          RESULT="$(docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -N -B tarsgo_migration -e "
            SELECT CONCAT(
              owner_id, '|',
              IF(parent_id IS NULL, 'NULL', parent_id), '|',
              owner_claimable, '|',
              collaboration_open, '|',
              deliverable, '|',
              JSON_LENGTH(execution_points), '|',
              JSON_LENGTH(cautions), '|',
              JSON_LENGTH(prerequisites), '|',
              CHAR_LENGTH(result), '|',
              (SELECT COUNT(*) FROM item_facts WHERE root_task_id = 100 AND content = 'legacy global fact' AND scope = 'global' AND is_active = 1), '|',
              (SELECT IF(task_id IS NULL, 'NULL', task_id) FROM item_activities WHERE content = 'legacy activity stays unlinked'), '|',
              (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'tarsgo_migration' AND table_name = 'task_dependencies'), '|',
              (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'item_activities' AND column_name = 'task_id'), '|',
              (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'tarsgo_migration' AND table_name = 'tasks' AND column_name = 'context_facts'), '|',
              (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'tarsgo_migration' AND table_name = 'item_fact_tasks')
            )
            FROM tasks WHERE id = 100;
          ")"
          test "$RESULT" = "101|NULL|0|0|旧版交付|0|0|0|0|1|NULL|1|1|0|1"
          docker compose exec -T db mysql -uroot -p"$CI_MYSQL_ROOT_PASSWORD" -e "DROP DATABASE tarsgo_migration;"

      - name: Create initial administrator
        run: |
          docker compose exec -T -e CI_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" api python - <<'PY'
          import os
          from sqlalchemy import select
          from app.auth import hash_password
          from app.db import SessionLocal
          from app.models import Member

          with SessionLocal() as db:
              assert db.scalar(select(Member.id).where(Member.email == "admin@example.com")) is None
              db.add(
                  Member(
                      name="张三",
                      email="admin@example.com",
                      password_hash=hash_password(os.environ["CI_ADMIN_PASSWORD"]),
                      role="admin",
                      status="active",
                  )
              )
              db.commit()
          PY

      - name: Verify V0.2 workflow
        run: python scripts/smoke_test.py workflow http://127.0.0.1

      - name: Verify scoped task view hierarchy
        run: docker compose exec -T api python -m tests.test_task_view_hierarchy

      - name: Verify shared execution scene
        run: docker compose exec -T api python -m tests.test_shared_execution

      - name: Verify scoped item information
        run: docker compose exec -T api python -m tests.test_scoped_item_information

      - name: Verify root item deletion
        run: docker compose exec -T api python -m tests.test_root_task_deletion

      - name: Verify school leave workflow
        run: docker compose exec -T api python -m tests.test_school_leave

      - name: Verify winter and summer camp leave workflow
        run: docker compose exec -T api python -m tests.test_camp_leave

      - name: Verify school leave completion loop
        run: docker compose exec -T api python -m tests.test_school_leave_completion

      - name: Verify Leave V2 workflows and DOCX templates
        run: docker compose exec -T api python -m tests.test_leave_v2

      - name: Verify school leave result cleanup job
        run: docker compose exec -T api python -m app.jobs.cleanup_school_leave_results

      - name: Verify school leave timer installer syntax
        run: |
          bash -n scripts/install_school_leave_timer.sh
          bash -n scripts/install_school_leave_result_cleanup_timer.sh

      - name: Verify team registration and role simplification
        run: docker compose exec -T api python -m tests.test_team_registration

      - name: Verify AI planner
        run: docker compose exec -T api python -m tests.test_ai_planner

      - name: Verify AI item review
        run: docker compose exec -T api python -m tests.test_ai_item_review

      - name: Verify AI provider adapters
        run: docker compose exec -T api python -m tests.test_ai_providers

      - name: Verify knowledge sources and planner context
        run: docker compose exec -T api python -m tests.test_knowledge

      - name: Restart database
        run: |
          docker compose restart db
          for i in $(seq 1 30); do
            if docker compose exec -T db mysqladmin ping -h 127.0.0.1 -uroot -p"$CI_MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; then
              break
            fi
            sleep 2
          done
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1/api/health

      - name: Verify persisted data
        run: python scripts/smoke_test.py persistence http://127.0.0.1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
